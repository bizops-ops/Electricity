<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}
.wrap{max-width:1600px;margin:0 auto;padding:12px}
.header{background:linear-gradient(135deg,#1e40af,#3b82f6 50%,#06b6d4);border-radius:14px;padding:16px 22px;margin-bottom:12px;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.85;margin-top:3px}
.hbtn{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:7px;padding:7px 14px;cursor:pointer;font-size:12px;font-weight:600}
.hbtn:hover{background:rgba(255,255,255,.35)}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;background:#fff;border-radius:10px;padding:6px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tab{padding:8px 16px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;color:#64748b;border:none;background:transparent;position:relative;display:inline-flex;align-items:center;gap:4px}
.tab:hover{background:#f1f5f9;color:#1e40af}
.tab.act{background:#1e40af;color:#fff;box-shadow:0 2px 8px rgba(30,64,175,.3)}
.tab .cnt{background:rgba(255,255,255,.25);border-radius:10px;padding:0 6px;font-size:10px}
.tab.act .cnt{background:rgba(255,255,255,.3)}
.tab:not(.act) .cnt{background:#e2e8f0;color:#475569}
.tdel{background:#ef4444;color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:11px;cursor:pointer;padding:0;margin-left:4px;line-height:16px;text-align:center}
.tdel:hover{background:#dc2626}
.stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sc{padding:10px 14px;border-radius:9px;cursor:pointer;min-width:100px;text-align:center;border:2px solid transparent;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.sc .v{font-size:22px;font-weight:800}
.sc .l{font-size:10px;font-weight:600;opacity:.85;margin-top:1px}
.sc.on{color:#fff!important}
.flt{background:#fff;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.flt input,.flt select{padding:7px 10px;border:1px solid #e2e8f0;border-radius:7px;font-size:12px;outline:none}
.flt input{min-width:180px}
.tw{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.ts{overflow:auto;max-height:58vh}
table{width:100%;border-collapse:collapse;font-size:12px;border:1px solid #d1d5db}
th{padding:7px 5px;text-align:left;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.4px;border:1px solid #d1d5db;position:sticky;top:0;background:#f8fafc;z-index:2;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:#1e40af}
td{padding:5px;vertical-align:middle;border:1px solid #e2e8f0}
tr.rod{background:#fef2f2!important}
tr.rpd{background:#bbf7d0!important}
tr:hover{background:#f0f9ff!important}
tr:nth-child(even){background:#fafbfc}
tr.newrow{background:#eff6ff!important;border:2px solid #3b82f6}
tr.newrow td{border-color:#bfdbfe}
.nr-inp{padding:4px 6px;font-size:11px;border:1px solid #93c5fd;border-radius:4px;outline:none;width:100%;box-sizing:border-box;background:#fff}
.nr-inp:focus{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.15)}
.nr-sel{padding:4px 4px;font-size:11px;border:1px solid #93c5fd;border-radius:4px;outline:none;background:#fff;width:100%}
.nr-save{background:#22c55e;color:#fff;border:none;border-radius:5px;padding:4px 10px;cursor:pointer;font-size:10px;font-weight:700;white-space:nowrap}
.nr-save:hover{background:#16a34a}
.nr-cancel{background:#ef4444;color:#fff;border:none;border-radius:5px;padding:4px 8px;cursor:pointer;font-size:10px;font-weight:700;white-space:nowrap}
.nr-cancel:hover{background:#dc2626}
.cl{cursor:pointer;display:inline-block;padding:1px 3px;border-radius:3px;font-size:11px;min-width:24px}
.cl:hover{background:#e0f2fe}
.cl.mt{color:#94a3b8}
.ce{display:inline-flex;gap:2px;align-items:center}
.ce input{padding:2px 3px;font-size:11px;border:1px solid #3b82f6;border-radius:3px;outline:none;width:120px}
.ce .sv{background:#22c55e;color:#fff;border:none;border-radius:3px;padding:0 5px;cursor:pointer;font-size:10px;height:20px}
.ce .cn{background:#ef4444;color:#fff;border:none;border-radius:3px;padding:0 5px;cursor:pointer;font-size:10px;height:20px}
.lk{color:#2563eb;font-weight:600;text-decoration:none;font-size:11px}
.lk:hover{text-decoration:underline}
.cac{font-family:'Courier New',monospace;font-size:11px}
.cat{user-select:all;cursor:text;padding:1px 3px;border-radius:3px}
.cat::selection{background:#bfdbfe}
.cab{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:10px;padding:0 3px;opacity:0}
td:hover .cab{opacity:1}
.cab:hover{color:#3b82f6}
.tag{display:inline-block;padding:1px 7px;border-radius:16px;font-size:9px;font-weight:700;white-space:nowrap}
.del{background:none;border:none;color:#ef4444;cursor:pointer;font-size:13px;padding:1px 4px}
.del:hover{background:#fef2f2;border-radius:4px}
.ba{display:flex;gap:2px;justify-content:center;align-items:center}
.ub{background:#eff6ff;color:#2563eb;border:1px dashed #93c5fd;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:9px;font-weight:600}
.ub:hover{background:#dbeafe;border-color:#3b82f6}
.vb{border:none;border-radius:3px;padding:1px 5px;cursor:pointer;font-size:9px;font-weight:600}
.eb{background:#fef3c7;color:#d97706;border:none;border-radius:3px;padding:1px 4px;cursor:pointer;font-size:9px}
.rb{background:#fee2e2;color:#dc2626;border:none;border-radius:3px;padding:1px 3px;cursor:pointer;font-size:8px}
.bc{text-align:center;min-width:80px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center}
.md{background:#fff;border-radius:14px;padding:20px;max-width:95vw;max-height:90vh;overflow:auto}
.md h2{margin:0 0 14px;font-size:17px;font-weight:700}
.md label{display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:2px}
.md input,.md select{width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:7px;font-size:12px;outline:none;margin-bottom:8px;box-sizing:border-box}
.mbtn{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.mbtn button{padding:7px 18px;border-radius:7px;font-size:12px;cursor:pointer}
.mcn{border:1px solid #e2e8f0;background:#fff;color:#475569}
.msv{border:none;background:#3b82f6;color:#fff;font-weight:600}
.ft{margin-top:10px;padding:6px 14px;background:#fff;border-radius:7px;font-size:10px;color:#94a3b8;display:flex;justify-content:space-between;flex-wrap:wrap}
.df{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:600;text-decoration:none;margin-left:6px}
.step{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.snum{background:#3b82f6;color:#fff;border-radius:50%;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.snum.g{background:#22c55e}
.stxt{font-size:12px;color:#475569}
.add-row-btn{background:none;border:2px dashed #93c5fd;border-radius:6px;padding:6px 0;width:100%;cursor:pointer;color:#3b82f6;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:2px}
.add-row-btn:hover{background:#eff6ff;border-color:#3b82f6}
.imp-preview{margin:12px 0;max-height:260px;overflow:auto;border:1px solid #e2e8f0;border-radius:8px}
.imp-preview table{font-size:11px;width:100%}
.imp-preview th{background:#f1f5f9;font-size:10px;padding:5px 6px;position:static}
.imp-preview td{padding:4px 6px;font-size:11px}
.imp-info{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;margin:10px 0;font-size:12px;color:#1e40af}
.imp-warn{background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;margin:10px 0;font-size:12px;color:#92400e}
.drop-zone{border:2px dashed #93c5fd;border-radius:10px;padding:30px 20px;text-align:center;cursor:pointer;transition:all .2s;background:#fafbff}
.drop-zone:hover,.drop-zone.drag{border-color:#3b82f6;background:#eff6ff}
.drop-zone p{margin:4px 0;font-size:13px;color:#475569}
.drop-zone .icon{font-size:28px;margin-bottom:6px}
.drop-zone .sub{font-size:10px;color:#94a3b8}
</style>
</head>

// Column name mapping — flexible matching
var COL_MAP={
  "location":["location","store","site","place","loc","s no","sno"],
  "brand":["brand","brand name"],
  "company":["company","electricity company","elec company","provider","discom"],
  "ca":["ca","ca no","ca no.","ca number","consumer no","consumer number","account"],
  "billDate":["bill date","billdate","billing date"],
  "amount":["amount","amt","bill amount","₹ amount","rs","total","rs amount","₹amount","bill amt"],
  "dueDate":["due date","duedate","due","payment due","due by","last date"],
  "status":["status","payment status","status  payment date","payment date","status  payment","paid","payment"],
  "remarks":["remarks","remark","notes","note","comment","comments"],
  "billLink":["bill link","billlink","bill url","bill"],
  "receiptLink":["receipt link","receiptlink","receipt url","receipt"]
};

function matchCol(header){
  var raw=header.toLowerCase().trim();
  // exact known headers first
  if(raw==="s.no"||raw==="s no"||raw==="sno"||raw==="#"||raw==="sr"||raw==="sr no"||raw==="sr.")return null; // skip serial number
  if(raw==="status & payment date"||raw==="status &amp; payment date"||raw==="status and payment date")return "status";
  if(raw==="₹ amount"||raw==="rs amount"||raw==="bill amount")return "amount";
  if(raw==="electricity company")return "company";
  if(raw==="ca no."||raw==="ca no"||raw==="ca number")return "ca";
  if(raw==="due date")return "dueDate";
  if(raw==="bill date")return "billDate";
  if(raw==="bill link")return "billLink";
  if(raw==="receipt link")return "receiptLink";
  
  var h=raw.replace(/[₹&]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
  for(var field in COL_MAP){
    for(var i=0;i<COL_MAP[field].length;i++){
      if(h===COL_MAP[field][i])return field;
    }
  }
  for(var field in COL_MAP){
    for(var i=0;i<COL_MAP[field].length;i++){
      if(h.indexOf(COL_MAP[field][i])>=0||COL_MAP[field][i].indexOf(h)>=0)return field;
    }
  }
  return null;
}

function matchCol(header){
  var h=header.toLowerCase().replace(/[^a-z0-9 ]/g,"").trim();
  for(var field in COL_MAP){
    for(var i=0;i<COL_MAP[field].length;i++){
      if(h===COL_MAP[field][i]||h.indexOf(COL_MAP[field][i])>=0)return field;
    }
  }
  return null;
}

function parseImportRows(sheet){
  var json=XLSX.utils.sheet_to_json(sheet,{header:1,defval:""});
  if(!json||json.length<2)return{headers:[],rows:[],mapped:{}};
  var rawH=json[0].map(function(h){return String(h).trim();});
  var mapped={};
  rawH.forEach(function(h,i){
    var m=matchCol(h);
    if(m)mapped[m]=i;
  });
  var rows=[];
  for(var r=1;r<json.length;r++){
    var row=json[r];
    var empty=true;
    for(var c=0;c<row.length;c++){if(String(row[c]).trim()){empty=false;break;}}
    if(!empty)rows.push(row);
  }
  return{headers:rawH,rows:rows,mapped:mapped};
}

function rowToRecord(row,mapped){
  function g(field){
    if(mapped[field]===undefined)return"";
    var v=row[mapped[field]];
    return v===undefined||v===null?"":String(v).trim();
  }
  return{
    id:String(_n++),
    location:g("location"),
    brand:g("brand"),
    company:g("company"),
    ca:g("ca"),
    billDate:g("billDate"),
    amount:g("amount"),
    dueDate:g("dueDate"),
    status:g("status"),
    remarks:g("remarks"),
    billLink:g("billLink"),
    receiptLink:g("receiptLink")
  };
}

function showSuggestions(v){
  var drop=document.getElementById("srchDrop");
  if(!drop)return;
  if(!v||v.length<1){drop.style.display="none";return;}
  var s=v.toLowerCase();
  var data=gd();
  var seen={};var items=[];
  data.forEach(function(r){
    var fields=[
      {type:"📍 Location",val:r.location},
      {type:"🏷 Brand",val:r.brand},
      {type:"🔢 CA No.",val:r.ca},
      {type:"🏢 Company",val:r.company}
    ];
    fields.forEach(function(f){
      if(!f.val)return;
      if(f.val.toLowerCase().indexOf(s)>=0){
        var key=f.type+":"+f.val;
        if(!seen[key]){seen[key]=1;items.push(f);}
      }
    });
  });
  if(!items.length){drop.style.display="none";return;}
  items=items.slice(0,10);
  var h='';
  items.forEach(function(it){
    var escaped=E(it.val).replace(new RegExp('('+v.replace(/[.*+?^${}()|[\]\\]/g,'\\function setSrch(v){srch=v;render();}')+')','gi'),'<b style="color:#1e40af">$1</b>');
