<script>
/* ========================================= */
/* ===== AUTH GATE ===== */
/* ========================================= */
var AUTH_ID="Bizops@2026";
var AUTH_PASS="Zippee@1234";
var isAuthed=false;

function doLogin(){
  var u=document.getElementById("authUser").value.trim();
  var p=document.getElementById("authPass").value;
  var errEl=document.getElementById("authError");
  if(u===AUTH_ID&&p===AUTH_PASS){
    isAuthed=true;
    document.getElementById("authOverlay").style.display="none";
    document.getElementById("app").style.display="block";
    errEl.style.display="none";
    loadFromDB();
  }else{
    errEl.style.display="block";
    document.getElementById("authPass").value="";
    document.getElementById("authPass").focus();
    errEl.style.animation="none";
    errEl.offsetHeight;
    errEl.style.animation="shake .4s ease";
  }
}

function doLogout(){
  isAuthed=false;
  document.getElementById("app").style.display="none";
  document.getElementById("authOverlay").style.display="flex";
  document.getElementById("authUser").value="";
  document.getElementById("authPass").value="";
  document.getElementById("authError").style.display="none";
  document.getElementById("authUser").focus();
}

document.getElementById("authBtn").addEventListener("click",doLogin);
document.getElementById("authUser").addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();document.getElementById("authPass").focus();}
});
document.getElementById("authPass").addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();doLogin();}
});
document.getElementById("togglePass").addEventListener("click",function(){
  var inp=document.getElementById("authPass");
  if(inp.type==="password"){inp.type="text";this.textContent="🙈";}
  else{inp.type="password";this.textContent="👁";}
});

/* ========================================= */
/* ===== SUPABASE CONFIG ===== */
/* ========================================= */
var SUPA_URL="https://awsrsmddcfksdrfpijqf.supabase.co";
var SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3c3JzbWRkY2Zrc2RyZnBpanFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MzA5MzksImV4cCI6MjA5MDIwNjkzOX0.eNI3Sv6Pqp-bK7I16ph-r5PZNAwSA86_S7AcEO6DSQ4";
var SUPA_TBL="electricity_bills";
var syncStatus="ok";

function supaFetch(path,opts){
  opts=opts||{};
  var h={"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json"};
  if(opts.prefer)h["Prefer"]=opts.prefer;
  return fetch(SUPA_URL+"/rest/v1/"+path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
}

/* ========================================= */
/* ===== GLOBALS ===== */
/* ========================================= */
var BILL_FOLDER="https://drive.google.com/drive/folders/1asQDHp907t6zQToBnTOcScpZZp-R4mR-";
var RCPT_FOLDER="https://drive.google.com/drive/folders/1U5yGOiRmvUBruo0dPktCUy_9-Jyvdx2W";
var CU_DEFAULT={"BESCOM":"https://www.bescom.co.in/bescom/main/quick-payment","BEST":"https://www.bestundertaking.net/","Adani Power":"https://www.adanielectricity.com/pay-your-bill/online-payments","MSEDCL":"https://wss.mahadiscom.in/wss/wss?uiActionName=getViewPayBill","Tata Power Mumbai":"https://pgi.billdesk.com/pgidsk/pgmerc/tatapwr/TATAPWRDetails.jsp","BSES":"https://www.bsesdelhi.com/web/brpl/quick-pay","BSES(rajdhani)":"https://www.bsesdelhi.com/web/brpl/quick-pay","BSES Yamuna":"https://www.bsesdelhi.com/web/bypl/verify-quickpay?p_p_id=com_bses_quick_pay_verification_portlet_QuickPayVerificationPortlet&p_p_lifecycle=1&p_p_state=normal&p_p_mode=view&_com_bses_quick_pay_verification_portlet_QuickPayVerificationPortlet_javax.portlet.action=submitQuickPayVerification","TSERC":"https://tgsouthernpower.org/paybillonline","UPCL":"https://www.upcl.org/wss/viewBill","PSPCL":"https://billpayment.pspcl.in/pgBillPay.aspx?uc=BillPayAdvance","CESC Limited":"https://srvcs.cesc.co.in/ptrlineins/mjpgav_payon/scriptfiles/monthlybill.php","TNEB":"https://www.tnebnet.org/awp/login?locale=ta","PVVNL":"https://consumer.uppcl.org/wss/pay_bill_home","JVVNL":"https://www.billdesk.com/pgidsk/pgmerc/jvvnljp/JVVNLJPDetails.jsp","TATA Power Delhi":"https://www.tatapower-ddl.com/billpay/paybillonline.aspx","MGVCL":"https://mpay.guvnl.in/paytm/QuickPay.php?&company=MGVCL","KSEB":"https://wss.kseb.in/selfservices/quickpay","KESCO":"https://www.kfresco.co.in/quickpay","TANGEDCO":"https://www.tnebnet.org/awp/login?locale=ta","WBSEDCL":"https://www.wbsedcl.in/irj/go/km/docs/internet/webpage/Quick_Pay.html","DHBVN":"https://www.dhbvn.org.in/web/dhbvn/bill-payment","UHBVN":"https://www.uhbvn.org.in/web/uhbvn/bill-payment","AVVNL":"https://energy.rajasthan.gov.in/content/raj/energy-department/avvnl/en/home.html","TPDDL":"https://www.tatapower-ddl.com/billpay/paybillonline.aspx","CSPDCL":"https://cspdcl.co.in/QuickBillPay/QuickPay","SOUTHCO":"https://www.tpsouthernodisha.com/","HESCOM":"https://hescom.karnataka.gov.in/","MESCOM":"https://mescom.karnataka.gov.in/","GESCOM":"https://gescom.karnataka.gov.in/"};
var customCompanies={};
var CU=Object.assign({},CU_DEFAULT,customCompanies);

function addCompany(n,u){if(!n)return;customCompanies[n]=u||"#";CU[n]=u||"#";}

var _n=1;
var INIT_DATA={"Oct 2025":[],"Nov 2025":[],"Dec 2025":[],"Jan 2026":[],"Mar 2026":[],"Apr 2026":[]};
var allData={};
var actMonth="Apr 2026",editing=null,editVal="",flt="all",srch="",compF="all",brandF="all",sCol=null,sDir="asc";
var addingRow=false;
var saveQueue=null,saving=false;

/* ========================================= */
/* ===== SUPABASE LOAD/SAVE ===== */
/* ========================================= */
async function loadFromDB(){
  if(!isAuthed)return;
  try{
    var resp=await supaFetch(SUPA_TBL+"?select=*&order=id.asc&limit=5000");
    if(!resp.ok)throw new Error("HTTP "+resp.status);
    var rows=await resp.json();
    allData={};
    if(Array.isArray(rows)&&rows.length>0){
      rows.forEach(function(r){
        var m=r.month||"Apr 2026";
        if(!allData[m])allData[m]=[];
        allData[m].push({id:String(r.id),_dbId:r.id,location:r.location||"",brand:r.brand||"",company:r.company||"",ca:r.ca||"",billDate:r.bill_date||"",amount:r.amount||"",dueDate:r.due_date||"",status:r.status||"",remarks:r.remarks||"",billLink:r.bill_link||"",receiptLink:r.receipt_link||""});
      });
      var sorted=Object.keys(allData).sort(mSort);
      actMonth=sorted[sorted.length-1];
      syncStatus="ok";
    }else{
      allData={"Apr 2026":[]};
      actMonth="Apr 2026";
      syncStatus="ok";
    }
  }catch(e){
    console.log("DB load error:",e);
    allData={"Apr 2026":[]};
    actMonth="Apr 2026";
    syncStatus="err";
  }
  render();
}

async function saveToDB(){if(saveQueue)clearTimeout(saveQueue);saveQueue=setTimeout(doSave,800);}

async function doSave(){
  if(saving)return;
  saving=true;syncStatus="saving";render();
  try{
    var m=actMonth;
    await supaFetch(SUPA_TBL+"?month=eq."+encodeURIComponent(m),{method:"DELETE"});
    var d=gd();
    if(d.length>0){
      var rows=d.map(function(r){
        return{month:m,location:r.location,brand:r.brand,company:r.company,ca:r.ca,bill_date:r.billDate,amount:r.amount,due_date:r.dueDate,status:r.status,remarks:r.remarks,bill_link:r.billLink,receipt_link:r.receiptLink};
      });
      var resp=await supaFetch(SUPA_TBL,{method:"POST",body:rows,prefer:"return=representation"});
      var ins=await resp.json();
      if(Array.isArray(ins)){
        for(var i=0;i<ins.length&&i<d.length;i++){d[i]._dbId=ins[i].id;d[i].id=String(ins[i].id);}
      }
    }
    syncStatus="ok";
  }catch(e){console.log("Save error:",e);syncStatus="err";}
  saving=false;render();
}

async function saveAllToDB(){
  syncStatus="saving";render();
  try{
    await supaFetch(SUPA_TBL+"?id=gt.0",{method:"DELETE"});
    var all=[];
    Object.keys(allData).forEach(function(m){
      (allData[m]||[]).forEach(function(r){
        all.push({month:m,location:r.location,brand:r.brand,company:r.company,ca:r.ca,bill_date:r.billDate,amount:r.amount,due_date:r.dueDate,status:r.status,remarks:r.remarks,bill_link:r.billLink,receipt_link:r.receiptLink});
      });
    });
    for(var i=0;i<all.length;i+=500){
      await supaFetch(SUPA_TBL,{method:"POST",body:all.slice(i,i+500),prefer:"return=minimal"});
    }
    syncStatus="ok";
    showToast("✅ Saved "+all.length+" records");
    await loadFromDB();
  }catch(e){syncStatus="err";showToast("⚠️ Save failed");render();}
}

/* ========================================= */
/* ===== CORE FUNCTIONS ===== */
/* ========================================= */
function gd(){return allData[actMonth]||[];}
function sd(d){allData[actMonth]=d;saveToDB();}
function E(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function getUrl(c){return CU[c]||"#";}

function mSort(a,b){
  var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var pa=(a||"").split(" "),pb=(b||"").split(" ");
  var ya=parseInt(pa[1])||0,yb=parseInt(pb[1])||0;
  if(ya!==yb)return ya-yb;
  return(M.indexOf(pa[0])||0)-(M.indexOf(pb[0])||0);
}

function isCurr(m){
  try{
    var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var p=(m||"").split(" ");
    if(p.length<2)return true;
    var mi=M.indexOf(p[0]),yi=parseInt(p[1]);
    if(isNaN(yi)||mi<0)return true;
    var n=new Date();
    if(yi>n.getFullYear())return true;
    if(yi<n.getFullYear())return false;
    return mi>=n.getMonth();
  }catch(e){return true;}
}

function displayDate(d){
  if(!d)return"";
  var m=d.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m)return m[3]+"."+m[2]+"."+m[1];
  return d;
}

function dueTag(d,status){
  if(!d||!isCurr(actMonth))return null;
  if(status&&status.toLowerCase().indexOf("paid")>=0)return null;
  var dt=d;
  if(!/^\d{4}-/.test(dt))dt=parseDate(dt);
  try{
    var dd=new Date(dt+"T00:00:00"),now=new Date();
    now.setHours(0,0,0,0);
    var diff=Math.ceil((dd-now)/864e5);
    if(diff<0)return{l:"Overdue ("+Math.abs(diff)+"d)",c:"#dc2626",b:"#fef2f2"};
    if(diff===0)return{l:"Due Today!",c:"#dc2626",b:"#fef2f2"};
    if(diff<=3)return{l:"Due in "+diff+"d",c:"#ea580c",b:"#fff7ed"};
    if(diff<=5)return{l:"Due in "+diff+"d",c:"#d97706",b:"#fffbeb"};
    if(diff<=7)return{l:"Due in "+diff+"d",c:"#ca8a04",b:"#fefce8"};
    return{l:"Due in "+diff+"d",c:"#16a34a",b:"#f0fdf4"};
  }catch(e){return null;}
}

function getStats(d){
  var now=new Date();now.setHours(0,0,0,0);
  var o=0,t=0,w5=0,w7=0,amt=0,oAmt=0,tAmt=0,w5Amt=0,w7Amt=0,ic=isCurr(actMonth);
  d.forEach(function(r){
    var a=parseFloat(r.amount)||0;
    if(a>0)amt+=a;
    if(!ic||!r.dueDate)return;
    var paid=(r.status||"").toLowerCase().indexOf("paid")>=0;
    if(paid)return;
    var dt=r.dueDate;
    if(!/^\d{4}-/.test(dt))dt=parseDate(dt);
    var dd=new Date(dt+"T00:00:00");
    if(isNaN(dd.getTime()))return;
    var diff=Math.ceil((dd-now)/864e5);
    if(diff<0){o++;oAmt+=a;}
    if(diff===0){t++;tAmt+=a;}
    if(diff>=0&&diff<=5){w5++;w5Amt+=a;}
    if(diff>=0&&diff<=7){w7++;w7Amt+=a;}
  });
  return{ov:o,td:t,w5:w5,w7:w7,total:d.length,amt:amt,oAmt:oAmt,tAmt:tAmt,w5Amt:w5Amt,w7Amt:w7Amt};
}

function getF(){
  var d=gd().slice();
  if(srch){var s=srch.toLowerCase();d=d.filter(function(r){return r.location.toLowerCase().indexOf(s)>=0||r.ca.indexOf(s)>=0||r.brand.toLowerCase().indexOf(s)>=0;});}
  if(compF!=="all")d=d.filter(function(r){return r.company===compF;});
  if(brandF!=="all")d=d.filter(function(r){return r.brand===brandF;});
  if(flt!=="all"&&isCurr(actMonth)){
    var now=new Date();now.setHours(0,0,0,0);
    d=d.filter(function(r){
      if(!r.dueDate)return false;
      var paid=(r.status||"").toLowerCase().indexOf("paid")>=0;
      if(paid)return false;
      var dt=r.dueDate;
      if(!/^\d{4}-/.test(dt))dt=parseDate(dt);
      var dd=new Date(dt+"T00:00:00");
      if(isNaN(dd.getTime()))return false;
      var diff=Math.ceil((dd-now)/864e5);
      if(flt==="overdue")return diff<0;
      if(flt==="today")return diff===0;
      if(flt==="5days")return diff>=0&&diff<=5;
      if(flt==="7days")return diff>=0&&diff<=7;
      return true;
    });
  }
  if(sCol)d.sort(function(a,b){var va=a[sCol]||"",vb=b[sCol]||"";if(sCol==="amount"){va=parseFloat(va)||0;vb=parseFloat(vb)||0;}return va<vb?(sDir==="asc"?-1:1):va>vb?(sDir==="asc"?1:-1):0;});
  return d;
}

var COL_MAP={"location":["location","store","site","place","loc"],"brand":["brand","brand name"],"company":["company","electricity company","elec company","provider","discom"],"ca":["ca","ca no","ca no.","ca number","consumer no","consumer number","account"],"billDate":["bill date","billdate","billing date"],"amount":["amount","amt","bill amount","rs amount","bill amt","total"],"dueDate":["due date","duedate","due","payment due","due by","last date","status payment date","status payment date","status and payment date"],"status":["status","payment status","paid","payment"],"remarks":["remarks","remark","notes","note","comment","comments"],"billLink":["bill link","billlink","bill url"],"receiptLink":["receipt link","receiptlink","receipt url"]};

function matchCol(header){
  var raw=header.toLowerCase().trim();
  if(raw==="s.no"||raw==="s no"||raw==="sno"||raw==="#"||raw==="sr"||raw==="sr no"||raw==="sr."||raw==="sr.no")return null;
  if(raw==="bill no"||raw==="bill no."||raw==="bill number"||raw==="billno")return null;
  if(raw==="status & payment date"||raw==="status &amp; payment date"||raw==="status and payment date")return"dueDate";
  if(raw==="₹ amount"||raw==="rs amount"||raw==="bill amount"||raw==="amount")return"amount";
  if(raw==="electricity company")return"company";
  if(raw==="ca no."||raw==="ca no"||raw==="ca number")return"ca";
  if(raw==="due date")return"dueDate";
  if(raw==="bill date")return"billDate";
  if(raw==="bill link")return"billLink";
  if(raw==="receipt link")return"receiptLink";
  if(raw==="location")return"location";
  if(raw==="brand")return"brand";
  if(raw==="status")return"status";
  if(raw==="remarks"||raw==="remark")return"remarks";
  var h=raw.replace(/[₹&]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
  for(var field in COL_MAP){for(var i=0;i<COL_MAP[field].length;i++){if(h===COL_MAP[field][i])return field;}}
  for(var field in COL_MAP){for(var i=0;i<COL_MAP[field].length;i++){if(h.indexOf(COL_MAP[field][i])>=0)return field;}}
  return null;
}

function parseImportRows(sheet){
  var json=XLSX.utils.sheet_to_json(sheet,{header:1,defval:"",raw:true});
  if(!json||json.length<2)return{headers:[],rows:[],mapped:{}};
  var rawH=json[0].map(function(h){return String(h).trim();});
  var mapped={};
  rawH.forEach(function(h,i){var m=matchCol(h);if(m)mapped[m]=i;});
  var rows=[];
  for(var r=1;r<json.length;r++){
    var row=json[r];var empty=true;
    for(var c=0;c<row.length;c++){if(String(row[c]).trim()){empty=false;break;}}
    if(!empty)rows.push(row);
  }
  return{headers:rawH,rows:rows,mapped:mapped};
}

function parseDate(v){
  if(!v&&v!==0)return"";
  if(v instanceof Date){if(!isNaN(v.getTime()))return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");return"";}
  if(typeof v==="number"){if(v>30000&&v<60000){var d=new Date(Math.round((v-25569)*86400*1000));if(!isNaN(d.getTime()))return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}return"";}
  var s=String(v).trim();
  if(!s)return"";
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  var md=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(md)return md[3]+"-"+String(md[2]).padStart(2,"0")+"-"+String(md[1]).padStart(2,"0");
  var m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m){var day=parseInt(m[1]),mon=parseInt(m[2]);if(day>12)return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");if(mon>12)return m[3]+"-"+String(m[1]).padStart(2,"0")+"-"+String(m[2]).padStart(2,"0");return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");}
  var m3=s.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})$/);
  if(m3)return m3[1]+"-"+String(m3[2]).padStart(2,"0")+"-"+String(m3[3]).padStart(2,"0");
  var m4=s.match(/^(\d{4})-(\d{2})-(\d{2})T/);
  if(m4)return m4[1]+"-"+m4[2]+"-"+m4[3];
  var d2=new Date(s);
  if(!isNaN(d2.getTime())&&d2.getFullYear()>2000)return d2.getFullYear()+"-"+String(d2.getMonth()+1).padStart(2,"0")+"-"+String(d2.getDate()).padStart(2,"0");
  return s;
}

function rowToRecord(row,mapped){
  function g(field){if(mapped[field]===undefined)return"";var v=row[mapped[field]];return v===undefined||v===null?"":String(v).trim();}
  function gd(field){if(mapped[field]===undefined)return"";var v=row[mapped[field]];if(v===undefined||v===null)return"";return parseDate(v);}
  return{id:String(_n++),location:g("location"),brand:g("brand"),company:g("company"),ca:g("ca"),billDate:gd("billDate"),amount:g("amount"),dueDate:gd("dueDate"),status:g("status"),remarks:g("remarks"),billLink:g("billLink"),receiptLink:g("receiptLink")};
}

}

function triggerImport(){var inp=document.getElementById("csvFileInput");inp.value="";inp.click();}

document.getElementById("csvFileInput").addEventListener("change",function(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(evt){
    try{
      var data=new Uint8Array(evt.target.result);
      var wb=XLSX.read(data,{type:"array",cellDates:true,raw:false});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var parsed=parseImportRows(ws);
      if(!parsed.rows.length){alert("No data rows found.");return;}
      showImportModal(parsed);
    }catch(err){alert("Error: "+err.message);}
  };
  reader.readAsArrayBuffer(file);
});

function startAddRow(){addingRow=true;editing=null;render();}
function cancelNewRow(){addingRow=false;render();}

function saveNewRow(){
  var loc=(document.getElementById("nr_loc").value||"").trim();

}

document.addEventListener("keydown",function(e){
  if(!addingRow)return;

document.addEventListener("click",function(e){

function setSrch(v){srch=v;renderTable();}

function doSearch(v){srch=v;renderTable();showSuggestions(v);}

function showSuggestions(v){
  var drop=document.getElementById("srchDrop");if(!drop)return;
  if(!v||v.length<1){drop.style.display="none";return;}
  var s=v.toLowerCase();var data=gd();var seen={};var items=[];
  data.forEach(function(r){
    [{type:"📍 Location",val:r.location},{type:"🏷 Brand",val:r.brand},{type:"🔢 CA No.",val:r.ca},{type:"🏢 Company",val:r.company}].forEach(function(f){
      if(!f.val)return;
      if(f.val.toLowerCase().indexOf(s)>=0){var key=f.type+":"+f.val;if(!seen[key]){seen[key]=1;items.push(f);}}
    });
  });
  if(!items.length){drop.style.display="none";return;}
  items=items.slice(0,10);
  var h='';
  items.forEach(function(it){
    var safe=E(it.val).replace(/'/g,"\\'");
    h+='<div style="padding:7px 12px;cursor:pointer;font-size:12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #f1f5f9" onmousedown="pickSugg(\''+safe+'\')" onmouseover="this.style.background=\'#eff6ff\'" onmouseout="this.style.background=\'#fff\'"><span style="font-size:10px;color:#94a3b8;white-space:nowrap">'+it.type+'</span><span>'+E(it.val)+'</span></div>';
  });
  drop.innerHTML=h;drop.style.display="block";
}

function pickSugg(val){
  srch=val;var drop=document.getElementById("srchDrop");if(drop)drop.style.display="none";
  renderTable();var inp=document.getElementById("srchInp");if(inp){inp.value=val;inp.focus();}
}

function renderTable(){
  var f=getF();var data=gd(),st=getStats(data);
  var statEls=document.querySelectorAll('.sc .v');
  if(statEls.length>=5){statEls[0].textContent=st.total;statEls[1].textContent=st.ov;statEls[2].textContent=st.td;statEls[3].textContent=st.w5;statEls[4].textContent=st.w7;}
  var countSpan=document.querySelector('.flt span[style*="margin-left"]');

function se(id,fd){
  var d=gd();
  for(var i=0;i<d.length;i++){if(d[i].id===id){editing=id+"_"+fd;editVal=d[i][fd]||"";break;}}
  render();
}

function cn(){editing=null;editVal="";render();}

function sv(id,fd){
  var v=editVal;
  if(fd==="status"&&v.toLowerCase().indexOf("paid")>=0&&!/\d{2}\.\d{2}\.\d{4}/.test(v)&&!/\d{4}-\d{2}-\d{2}/.test(v)&&!/\d{1,2}(st|nd|rd|th)\s/i.test(v)){
    var t=new Date();var ds=String(t.getDate()).padStart(2,"0")+"."+String(t.getMonth()+1).padStart(2,"0")+"."+t.getFullYear();
    v=v.replace(/\s*$/,"")+" on "+ds;
  }
  var d=gd();
  for(var i=0;i<d.length;i++){if(d[i].id===id){d[i][fd]=v;break;}}
  sd(d);editing=null;editVal="";render();
}

function ck(e,id,fd){if(e.key==="Enter")sv(id,fd);if(e.key==="Escape")cn();}

function rmF(id,fd){
  var d=gd();
  for(var i=0;i<d.length;i++){if(d[i].id===id){d[i][fd]="";break;}}
  sd(d);render();
}

function delR(id){
  var d=gd();var r=null;
  for(var i=0;i<d.length;i++){if(d[i].id===id){r=d[i];break;}}
  if(!r)return;
  if(!confirm('Delete "'+r.location+'" (CA: '+r.ca+')?'))return;
  if(!confirm('Final confirm: Remove "'+r.location+'"?'))return;
  sd(d.filter(function(x){return x.id!==id;}));render();
}

function prevFile(id,type){

function addMonth(){
  var name=prompt("Month name (e.g. May 2026):","");
  if(!name||!name.trim())return;
  var n=name.trim();
  if(allData[n]){alert("Exists!");return;}
  var prev=gd();
  allData[n]=prev.map(function(r){
    return{id:String(_n++),location:r.location,brand:r.brand,company:r.company,ca:r.ca,billDate:"",amount:"",dueDate:"",status:"",remarks:"",billLink:"",receiptLink:""};
  });
  actMonth=n;saveToDB();render();
}

function delMonth(){
  var m=actMonth;var months=Object.keys(allData);
  if(months.length<=1){alert("Cannot delete last month.");return;}
  var cnt=(allData[m]||[]).length;
  var step1=prompt("⚠️ DELETE \""+m+"\" ("+cnt+" stores)?\nType month name exactly:");
  if(!step1||step1.trim()!==m)return;
  if(!confirm("🔴 FINAL: Delete "+m+"?"))return;
  delete allData[m];
  try{supaFetch(SUPA_TBL+"?month=eq."+encodeURIComponent(m),{method:"DELETE"});}catch(e){}
  var rem=Object.keys(allData).sort(mSort);actMonth=rem[rem.length-1];render();
}

function resetM(){
  var cnt=(allData[actMonth]||[]).length;
  var s=prompt("⚠️ RESET \""+actMonth+"\"? Type RESET:");
  if(!s||s.trim()!=="RESET")return;
  allData[actMonth]=[];sd([]);render();showToast("🗑 Cleared "+actMonth);
}

function expMonth(){
  var d=gd();

  if(typeof XLSX!=="undefined"){
    try{
      var ws=XLSX.utils.aoa_to_sheet([hd].concat(d.map(function(r,i){return[i+1,r.location,r.brand,r.company,r.ca,r.billDate,r.amount,r.dueDate,r.status,r.remarks,r.billLink,r.receiptLink];})));
      ws["!cols"]=[{wch:5},{wch:25},{wch:15},{wch:22},{wch:16},{wch:12},{wch:10},{wch:12},{wch:25},{wch:25},{wch:35},{wch:35}];
      var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,actMonth);
      XLSX.writeFile(wb,"Electricity_"+actMonth.replace(" ","_")+".xlsx");return;
    }catch(e){}
  }
  alert("XLSX export failed");
}

function expAll(){

        ws["!cols"]=[{wch:5},{wch:25},{wch:15},{wch:22},{wch:16},{wch:12},{wch:10},{wch:12},{wch:25},{wch:25},{wch:35},{wch:35}];

      });
      XLSX.writeFile(wb,"Pan_India_Electricity_2026.xlsx");return;

}
